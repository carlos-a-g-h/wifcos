name: Test dependencies

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-python:
    runs-on: windows-2025
    steps:
      - name: Grab win32-stuff
        uses: actions/checkout@v4
        with:
          repository: carlos-a-g-h/win32-stuff
          ref: main
      - name: List content
        run: |
          dir

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check Tkinter availability
        run: |
          python -c "import sys; print(sys.executable); print(sys.version)"
          where.exe python
          python -c "import tkinter; print(tkinter.__file__); print(tkinter.TkVersion)"

  test-external:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Grub2 EFI
        run: bash GET_grub2-efi.sh

      - name: grubinst
        run: bash GET_grubinst.sh

      - name: Grub4DOS
        run: bash GET_grub4dos.sh

      - name: SystemD-Boot
        run: bash GET_systemd-boot.sh

      - name: Run find
        run: find dependency.*
