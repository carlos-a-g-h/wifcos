name: Test dependencies

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Grub2 EFI
        run: bash mkdep_grub2.sh

      - name: Grub4DOS
        run: bash mkdep_grub4dos.sh

      - name: grubinst
        run: bash mkdep_grubinst.sh

      - name: grubinst
        run: bash mkdep_systemd-boot.sh

      - name: Run a multi-line script
        run: find dep.*
