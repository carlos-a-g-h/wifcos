name: Test dependencies

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Grub2 EFI
        run: bash GET_grub2-efi.sh

      - name: grubinst
        run: bash GET_grubinst.sh

      - name: Grub4DOS
        run: bash GET_grub4dos.sh

      - name: SystemD-Boot
        run: bash GET_systemd-boot.sh

      - name: Run find
        run: find dependency.*
